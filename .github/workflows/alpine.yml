name: alpine-prebuilt-runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64]
    env:
      ARCH: ${{ matrix.arch }}
      TOOLS_DIR: ${{ github.workspace }}/.tools
    steps:
      - name: M40 independent review gate (execution blocked)
        run: |
          echo "::error::M40 execution blocked pending independent review; tests were not run."
          exit 1
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64]
    env:
      ARCH: ${{ matrix.arch }}
      TOOLS_DIR: ${{ github.workspace }}/.tools
    steps:
      - name: M40 independent review gate (execution blocked)
        run: |
          echo "::error::M40 execution blocked pending independent review; tests were not run."
          exit 1

# Validation-only branch based on PR35. Never merge over the product workflow.
name: m40-fixed-durable-cold-experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m40-cold-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixed-x86-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: x86_64
      TOOLS_DIR: ${{ github.workspace }}/.tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No rerun or runtime-code substitution
        run: |
          test "${{ github.run_attempt }}" = 1
          test -z "$(git diff 935bd746cb6ea6d9ed833a5125b8f4465dc31ee7 -- kernel userland scripts/qemu-test.py scripts/qemu-ready-type.py)"
      - name: Host tools only; never compile desktop libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld llvm make gcc git curl xorriso mtools cpio jq python3-pil tesseract-ocr tesseract-ocr-eng e2fsprogs fdisk libglib2.0-bin libglib2.0-dev pkg-config shared-mime-info
          scripts/install-qemu-alpine.sh
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          scripts/fetch-deps.sh
      - uses: actions/cache@v4
        with:
          path: ${{ env.TOOLS_DIR }}/dl/alpine
          key: alpine-desktop-v3.22-x86_64-${{ hashFiles('userland/alpine/locks/*.json') }}
          restore-keys: alpine-desktop-v3.22-x86_64-
      - name: Signed locked runtimes, no package scripts
        run: |
          sudo env TOOLS_DIR="$TOOLS_DIR" python3 userland/alpine/build.py --arch x86_64
          sudo env TOOLS_DIR="$TOOLS_DIR" python3 userland/alpine/build.py --arch x86_64 --profile desktop
          sudo chown -hR "$(id -u):$(id -g)" userland/alpine-root-x86_64 userland/alpine-desktop-root-x86_64 userland/build "$TOOLS_DIR/dl/alpine"
          chmod 4755 userland/alpine-root-x86_64/bin/busybox userland/alpine-desktop-root-x86_64/bin/busybox
      - name: Strict plan negative controls and tiny consumers
        run: |
          python3 scripts/m40-cold-host-tests.py
          scripts/alpine-build-tests.sh x86_64
          make -j2 ARCH=x86_64 USERLAND=alpine iso
      - name: Unchanged desktop prerequisite
        timeout-minutes: 15
        run: scripts/alpine-desktop-tests.sh x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-prerequisite-${{ github.run_id }}
          path: |
            build/test-alpine-desktop-*.log
            userland/build/alpine-desktop-x86_64.lock.json
          if-no-files-found: warn
      - name: Prepare immutable one-control one-guest plan
        run: python3 scripts/m40-cold-prepare.py
      - name: Exactly one signed Linux control
        timeout-minutes: 25
        run: python3 scripts/m40-cold-run.py linux1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-linux-${{ github.run_id }}
          path: |
            build/m40-cold/*.json
            build/m40-cold/*.txt
            build/m40-cold/linux*.out
            build/m40-cold/linux1.log
            build/m40-cold/linux1*.png
            scripts/m40-cold-*
            userland/tests/trace-snapshot/*.c
          if-no-files-found: warn
      - name: Exactly one 9os cold boot only after accepted Linux control
        timeout-minutes: 25
        run: python3 scripts/m40-cold-run.py guest1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-9os-${{ github.run_id }}
          path: |
            build/m40-cold/*.json
            build/m40-cold/guest1*.out
            build/m40-cold/guest1.log
            build/m40-cold/guest1*.png
            build/m40-cold/guest1*.txt
            build/x86_64-alpine/kernel.elf
            scripts/m40-cold-*
          if-no-files-found: warn

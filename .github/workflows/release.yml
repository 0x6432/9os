# Build 9os ISOs for x86_64, riscv64 and aarch64 and publish them as a GitHub release
# named after the build timestamp (UTC), e.g. "9os-20260105-142233".
name: build-and-release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:
    inputs:
      ports:
        description: "Build the graphics/ports userland (slower)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp:
    runs-on: ubuntu-24.04
    outputs:
      ts: ${{ steps.ts.outputs.ts }}
    steps:
      - id: ts
        name: M40 independent review gate (execution blocked)
        run: |
          echo "::error::M40 execution blocked pending independent review; tests were not run."
          exit 1
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
      TOOLS_DIR: ${{ github.workspace }}/.tools
      NO_PORTS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.ports) && '1' || '' }}
    steps:
      - name: M40 independent review gate (execution blocked)
        run: |
          echo "::error::M40 execution blocked pending independent review; tests were not run."
          exit 1
  release:
    needs: [stamp, build]
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: M40 independent review gate (execution blocked)
        run: |
          echo "::error::M40 execution blocked pending independent review; tests were not run."
          exit 1
